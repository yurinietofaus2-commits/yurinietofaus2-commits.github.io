<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murder Grid · Puzle de lógica y misterio</title>
<meta name="description" content="Murder Grid: coloca a los sospechosos en la cuadrícula y descubre al asesino. Un puzle de lógica y misterio de estilo anime para Android.">
<link rel="icon" href="icono.png">
<style>
  :root { --bg:#12143a; --card:#1c1f4f; --ink:#f1efff; --muted:#b9b6dc; --red:#e0344a; --gold:#e8c26a; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(circle at 50% 0%, #2a2d6e, var(--bg) 60%); color:var(--ink); font:16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display:flex; align-items:center; justify-content:center; }
  main { max-width:560px; padding:40px 24px; text-align:center; }
  img { width:140px; height:140px; border-radius:32px; box-shadow:0 12px 40px rgba(0,0,0,.45); }
  h1 { font-size:40px; letter-spacing:.04em; margin:20px 0 6px; }
  h1 span { color:var(--red); }
  p { color:var(--muted); margin:0 0 14px; }
  .soon { display:inline-block; margin-top:10px; padding:10px 18px; border-radius:999px; background:var(--card); color:var(--gold); font-weight:600; }
  footer { margin-top:36px; font-size:14px; }
  a { color:var(--gold); }
</style>
</head>
<body>
<main>
  <img src="icono.png" alt="Icono de Murder Grid">
  <h1>MURDER <span>GRID</span></h1>
  <p>Coloca a los sospechosos en la cuadrícula siguiendo las pistas y descubre quién estaba a solas con la víctima. Lógica pura, sin adivinar.</p>
  <span class="soon">Próximamente en Google Play</span>
  <footer>
    <a href="privacidad.html">Política de privacidad</a> · <a href="mailto:yurinietofaus2@gmail.com">Contacto</a><br>
    © 2026 Murder Grid Studio
  </footer>
</main>
</body>
</html>
